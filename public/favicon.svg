<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Electric Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Inner Soft Radial Light -->
    <radialGradient id="glow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Bright Rounded Hexagonal Badge (High Visibility on Any Browser Tab) -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Subtle Light Highlight -->
  <polygon points="32,5 56,19 56,45 32,59 8,45 8,19" fill="url(#glow)" />

  <!-- Bold, Ultra-Crisp White "E" Monogram with Cyber Cutouts -->
  <path d="M 20 18 H 44 V 25 H 28 V 29 H 41 V 35 H 28 V 39 H 44 V 46 H 20 Z" fill="#ffffff" />
  
  <!-- Cyan Accent Node -->
  <circle cx="44" cy="32" r="3" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5" />
</svg>